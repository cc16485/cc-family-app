<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caring Companions</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14606F">
<link rel="icon" href="assets/favicon.png">
<style>
  :root { --navy:#0D365F; --teal:#1F7A8C; --ink:#16283a; --muted:#55677a; --bg:#faf9f6; --card:#ffffff; --border:#e4e1d8; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:17px/1.55 Inter, Helvetica, Arial, sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { max-width:460px; width:100%; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px 24px; text-align:center; }
  img { width:72px; height:auto; margin-bottom:12px; }
  h1 { font-size:24px; color:var(--navy); margin:0 0 12px; }
  p { margin:0 0 14px; color:var(--muted); }
  a.call { display:inline-block; margin-top:6px; background:var(--teal); color:#fff; text-decoration:none; font-weight:700; padding:12px 22px; border-radius:10px; }
</style>
</head>
<body>
<main class="card" id="app">
  <img src="assets/cc-logo.png" alt="Caring Companions">
  <h1>The Booking App is no longer available</h1>
  <p>Caring Companions no longer offers the Booking App.</p>
  <p>To ask about care or a visit, please call our office.</p>
  <a class="call" href="tel:+14172348494">Call (417) 234-8494</a>
</main>
</body>
</html>
